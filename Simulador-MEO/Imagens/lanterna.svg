<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 340" width="120" height="340">
  <defs>
    <!-- Gradiente metálico do corpo de alumínio -->
    <linearGradient id="metalBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="25%" stop-color="#64748B" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="75%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Gradiente cromado do clipe e anéis -->
    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="40%" stop-color="#F8FAFC" />
      <stop offset="70%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Gradiente dourado/latão do anel refletor -->
    <linearGradient id="brassRing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="40%" stop-color="#FDE68A" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Brilho da lente emissora -->
    <radialGradient id="bulbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#FEF08A" />
      <stop offset="80%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#EAB308" />
    </radialGradient>

    <!-- Glow externo da luz da lanterna -->
    <filter id="glowEffect" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Aura de luz emitida pela ponta -->
  <circle cx="60" cy="24" r="22" fill="#FEF08A" opacity="0.65" filter="url(#glowEffect)" />
  <circle cx="60" cy="24" r="14" fill="#FFFFFF" opacity="0.9" filter="url(#glowEffect)" />

  <!-- Lente / Lâmpada de LED médica convexa -->
  <path d="M48,32 C48,16 72,16 72,32 Z" fill="url(#bulbGlow)" stroke="#FDE047" stroke-width="1.5" />

  <!-- Anel de vedação dourado da lente -->
  <rect x="46" y="32" width="28" height="6" rx="2" fill="url(#brassRing)" stroke="#78350F" stroke-width="0.8" />

  <!-- Cabeça Cônica chanfrada da lanterna -->
  <path d="M46,38 L74,38 L70,68 L50,68 Z" fill="url(#metalBody)" stroke="#1E293B" stroke-width="1" />
  <rect x="49" y="52" width="22" height="2" fill="#0F172A" opacity="0.5" />
  <rect x="49" y="58" width="22" height="2" fill="#0F172A" opacity="0.5" />

  <!-- Anel de conexão cromado -->
  <rect x="49" y="68" width="22" height="6" rx="1.5" fill="url(#chrome)" stroke="#334155" stroke-width="0.8" />

  <!-- Corpo Cilíndrico Principal (Caneta Clínica) -->
  <rect x="49" y="74" width="22" height="200" rx="4" fill="url(#metalBody)" stroke="#1E293B" stroke-width="1.2" />

  <!-- Ranhuras de Aderência (Grip Texturizado) -->
  <g fill="#0F172A" opacity="0.35">
    <rect x="50" y="90" width="20" height="1.5" />
    <rect x="50" y="95" width="20" height="1.5" />
    <rect x="50" y="100" width="20" height="1.5" />
    <rect x="50" y="105" width="20" height="1.5" />
    <rect x="50" y="110" width="20" height="1.5" />
    <rect x="50" y="115" width="20" height="1.5" />

    <!-- Grip inferior -->
    <rect x="50" y="235" width="20" height="1.5" />
    <rect x="50" y="240" width="20" height="1.5" />
    <rect x="50" y="245" width="20" height="1.5" />
    <rect x="50" y="250" width="20" height="1.5" />
  </g>

  <!-- Pupila Guia / Escala Pupilar Médica gravada no corpo (comum em penlights) -->
  <g opacity="0.55">
    <circle cx="60" cy="140" r="1.5" fill="#0F172A" />
    <circle cx="60" cy="152" r="2.5" fill="#0F172A" />
    <circle cx="60" cy="166" r="3.5" fill="#0F172A" />
    <circle cx="60" cy="182" r="4.5" fill="#0F172A" />
  </g>

  <!-- Clipe de Bolso de Metal Cromado (Lateral) -->
  <path d="M49,82 L38,85 L38,185 C38,190 44,192 46,188 L49,183" fill="none" stroke="url(#chrome)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="43" cy="187" r="3" fill="url(#chrome)" />

  <!-- Base / Tampa Traseira com Botão de Clique -->
  <rect x="51" y="274" width="18" height="8" rx="2" fill="url(#chrome)" stroke="#334155" stroke-width="0.8" />
  <rect x="53" y="282" width="14" height="6" rx="2" fill="#0F172A" stroke="#334155" stroke-width="0.8" />
</svg>
